name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Fetch native runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/LiteLDev/LeviLaunchroid.git "$RUNNER_TEMP/levilaunchroid-upstream"
          mkdir -p app/src/main/cpp/preloader app/src/main/cpp/libHttpClient
          cp -a "$RUNNER_TEMP/levilaunchroid-upstream/app/src/main/cpp/preloader/." app/src/main/cpp/preloader/
          cp -a "$RUNNER_TEMP/levilaunchroid-upstream/app/src/main/cpp/libHttpClient/." app/src/main/cpp/libHttpClient/
          test -f app/src/main/cpp/preloader/CMakeLists.txt
          test -d app/src/main/cpp/libHttpClient/Build/libHttpClient.Android

      - name: Prepare Google Services configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          if [[ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            python3 -m json.tool app/google-services.json >/dev/null
            python3 - <<'PY'
          import json
          import sys
          with open("app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in data.get("client", [])
          }
          if "com.codeoneditor.app" not in names:
              print("GOOGLE_SERVICES_JSON_BASE64 precisa conter package_name com.codeoneditor.app", file=sys.stderr)
              sys.exit(1)
          PY
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "launcher-ci-placeholder",
              "storage_bucket": "launcher-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {"package_name": "com.codeoneditor.app"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "CI_PLACEHOLDER_NOT_A_REAL_KEY"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK gerado: $APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-0.112-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
